# Ghost routes for Design Bytes.
# Not part of the theme zip: upload in Ghost admin under Settings → Labs →
# Routes. Locally it lives at content/settings/routes.yaml.
#
# /articles/ and /bytes/ are channels: filtered lists that update as posts are
# tagged. Unlike collections, channels don't change any post's URL.
# `data: tag.x` gives the templates the tag (for its description) and
# redirects /tag/article/, /tag/byte/ and /tag/resource/ to the section pages.
#
# /resources/ is a collection rather than a channel, so Resources stay out of
# the home feed: the home collection takes every post except those tagged
# "resource". Both collections use /{slug}/, so post URLs don't change.
# Collections are matched top to bottom; keep /resources/ above /.

routes:
  /articles/:
    controller: channel
    filter: tag:article
    template: articles
    data: tag.article
  /bytes/:
    controller: channel
    filter: tag:byte
    template: bytes
    data: tag.byte

collections:
  /resources/:
    permalink: /{slug}/
    filter: tag:resource
    template: resources
    data: tag.resource
  /:
    permalink: /{slug}/
    filter: tag:-resource
    template: index

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
